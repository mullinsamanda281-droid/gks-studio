<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stick Arena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; }
    #canvas { display: block; }
    #hud {
      position: fixed; top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 100;
    }
    .hud-panel { background: rgba(0,0,0,0.7); padding: 12px 16px; border-radius: 8px; color: #fff; font-size: 14px; }
    .health-bar { width: 200px; height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin-top: 8px; }
    .health-fill { height: 100%; background: linear-gradient(90deg, #e74c3c, #c0392b); transition: width 0.1s; }
    .ammo-display { font-family: monospace; font-size: 18px; font-weight: bold; }
    .kill-feed { position: fixed; top: 80px; right: 16px; color: #fff; font-size: 13px; text-align: right; }
    .kill-entry { opacity: 1; transition: opacity 0.5s; margin: 4px 0; }
    .kill-entry.fade { opacity: 0; }
    .timer { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
    #matchEnd { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 24px; z-index: 200; color: #fff; }
    #matchEnd.show { display: flex; }
    #matchEnd h1 { font-size: 48px; margin: 0; }
    #matchEnd button { padding: 16px 48px; font-size: 20px; background: #e74c3c; border: none; border-radius: 8px; color: #fff; cursor: pointer; }
    #matchEnd button:hover { background: #c0392b; }
    .crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 24px; height: 24px; pointer-events: none; z-index: 50; }
    .crosshair::before, .crosshair::after { content: ''; position: absolute; background: #fff; opacity: 0.8; }
    .crosshair::before { width: 2px; height: 16px; left: 50%; top: 50%; transform: translate(-50%, -50%) translateY(-12px); }
    .crosshair::after { width: 16px; height: 2px; left: 50%; top: 50%; transform: translate(-50%, -50%) translateX(-12px); }
    .weapon-name { position: fixed; bottom: 80px; left: 16px; color: #fff; font-size: 16px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
    .combo-display { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); color: #f39c12; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px #000; opacity: 0; transition: opacity 0.2s; }
    .combo-display.show { opacity: 1; }
  </style>
  <script type="module" crossorigin src="/assets/index-CPszRpar.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="crosshair"></div>
  <div id="hud">
    <div class="hud-panel">
      <div>HEALTH</div>
      <div class="health-bar"><div id="healthFill" class="health-fill" style="width: 100%"></div></div>
    </div>
    <div id="timer" class="timer">3:00</div>
    <div class="hud-panel" style="text-align: right;">
      <div id="ammoDisplay" class="ammo-display">-- / --</div>
      <div id="weaponName" class="weapon-name"></div>
    </div>
  </div>
  <div id="killFeed" class="kill-feed"></div>
  <div id="comboDisplay" class="combo-display">COMBO x1</div>
  <div id="matchEnd">
    <h1 id="winnerText">VICTORY</h1>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>
</body>
</html>
